name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Shared Scheme
      run: |
        mkdir -p XiaohaBatteryTracker.xcodeproj/xcshareddata/xcschemes
        cat << 'EOF' > XiaohaBatteryTracker.xcodeproj/xcshareddata/xcschemes/XiaohaBatteryTracker.xcscheme
        <?xml version="1.0" encoding="UTF-8"?>
        <Scheme LastUpgradeVersion="1600" version="1.7">
           <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                 <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                    <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="F10001" BuildableName="XiaohaBatteryTracker.app" BlueprintName="XiaohaBatteryTracker" ReferencedContainer="container:XiaohaBatteryTracker.xcodeproj" />
                 </BuildActionEntry>
              </BuildActionEntries>
           </BuildAction>
           <LaunchAction buildConfiguration="Release" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugShowExtension="internal" allowLocationSimulation="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                 <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="F10001" BuildableName="XiaohaBatteryTracker.app" BlueprintName="XiaohaBatteryTracker" ReferencedContainer="container:XiaohaBatteryTracker.xcodeproj" />
              </BuildableProductRunnable>
           </LaunchAction>
        </Scheme>
        EOF

    - name: Setup AppIcon & Assets
      run: |
        mkdir -p XiaohaBatteryTracker/Assets.xcassets/AppIcon.appiconset
        python3 -c "
        import struct, zlib
        def make_png(w, h, r, g, b):
            raw = b''
            for y in range(h):
                raw += b'\x00' + bytes([r, g, b, 255] * w)
            comp = zlib.compress(raw)
            def chunk(t, d):
                return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
            return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', comp) + chunk(b'IEND', b'')
        open('XiaohaBatteryTracker/Assets.xcassets/AppIcon.appiconset/icon_1024.png', 'wb').write(make_png(1024, 1024, 10, 26, 34))
        "
        cat << 'EOF' > XiaohaBatteryTracker/Assets.xcassets/AppIcon.appiconset/Contents.json
        {
          "images" : [
            {
              "filename" : "icon_1024.png",
              "idiom" : "universal",
              "platform" : "ios",
              "size" : "1024x1024"
            }
          ],
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        EOF

    - name: Build App
      run: |
        xcodebuild build \
                   -project XiaohaBatteryTracker.xcodeproj \
                   -scheme XiaohaBatteryTracker \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package into IPA
      run: |
        APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
        echo "Found App at: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r -9 XiaohaBatteryTracker.ipa Payload
        ls -lh XiaohaBatteryTracker.ipa
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XiaohaBatteryTracker-iOS-IPA
        path: XiaohaBatteryTracker.ipa
        retention-days: 30
