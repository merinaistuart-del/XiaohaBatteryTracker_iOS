name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Shared Scheme
      run: |
        mkdir -p XiaohaBatteryTracker.xcodeproj/xcshareddata/xcschemes
        cat << 'EOF' > XiaohaBatteryTracker.xcodeproj/xcshareddata/xcschemes/XiaohaBatteryTracker.xcscheme
        <?xml version="1.0" encoding="UTF-8"?>
        <Scheme LastUpgradeVersion="1600" version="1.7">
           <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                 <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                    <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="F10001" BuildableName="XiaohaBatteryTracker.app" BlueprintName="XiaohaBatteryTracker" ReferencedContainer="container:XiaohaBatteryTracker.xcodeproj" />
                 </BuildActionEntry>
              </BuildActionEntries>
           </BuildAction>
           <LaunchAction buildConfiguration="Release" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugShowExtension="internal" allowLocationSimulation="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                 <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="F10001" BuildableName="XiaohaBatteryTracker.app" BlueprintName="XiaohaBatteryTracker" ReferencedContainer="container:XiaohaBatteryTracker.xcodeproj" />
              </BuildableProductRunnable>
           </LaunchAction>
        </Scheme>
        EOF

    - name: Build App
      run: |
        xcodebuild build \
                   -project XiaohaBatteryTracker.xcodeproj \
                   -scheme XiaohaBatteryTracker \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package into IPA
      run: |
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        echo "Found APP at: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app found in build directory!"
          exit 1
        fi
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r -9 XiaohaBatteryTracker.ipa Payload
        ls -lh XiaohaBatteryTracker.ipa
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XiaohaBatteryTracker-iOS-IPA
        path: XiaohaBatteryTracker.ipa
        retention-days: 30
